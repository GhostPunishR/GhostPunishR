name: Update profile cards

on:
  schedule:
    - cron: "0 3 * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/update-profile-cards.yml"
      - "scripts/**"
      - "tests/**"
  pull_request:
    paths:
      - ".github/workflows/update-profile-cards.yml"
      - "scripts/**"
      - "tests/**"
      - "README.md"
  workflow_dispatch:

concurrency:
  group: update-profile-cards-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Test graph refresh and local image references
        run: python3 -m unittest discover -s tests -v
      - name: Verify live GitHub contribution data
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_USERNAME: ${{ github.repository_owner }}
        run: |
          python3 - <<'PY'
          from datetime import datetime, timezone
          import os
          from scripts.update_profile_graphs import fetch_contributions, render_activity, validate_svg

          username = os.environ["PROFILE_USERNAME"]
          days = fetch_contributions(username, datetime.now(timezone.utc))
          validate_svg(render_activity(days, username), "Contribution Graph")
          print(f"Rendered activity graph from {len(days)} real GitHub contribution days.")
          PY

  build:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Refresh local activity and summary graphs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_USERNAME: ${{ github.repository_owner }}
        run: python3 scripts/update_profile_graphs.py --username "$PROFILE_USERNAME"

      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: "username=${{ github.repository_owner }}&custom_title=${{ github.repository_owner }}&show_icons=true&hide_border=true&card_width=420&bg_color=141321&title_color=FF0055&text_color=03D8F3&icon_color=FCEE0C&ring_color=FF0055"
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: "username=${{ github.repository_owner }}&layout=compact&hide_border=true&card_width=420&bg_color=141321&title_color=FF0055&text_color=03D8F3"
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate streak stats
        uses: DenverCoder1/github-readme-streak-stats@main
        with:
          options: "user=${{ github.repository_owner }}&hide_border=true&background=141321&stroke=FF0055&ring=FF0055&fire=FCEE0C&currStreakLabel=03D8F3&sideLabels=03D8F3&currStreakNum=FCEE0C&sideNums=FCEE0C&dates=03D8F3"
          path: profile/streak.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg

          if git diff --cached --quiet; then
            echo "Profile cards are already up to date."
            exit 0
          fi

          git commit -m "chore: update profile cards"
          git pull --rebase origin main
          git push origin HEAD:main
